os: linux
dist: jammy
language: java
jdk: openjdk25
cache:
  directories:
    - "$HOME/.m2"
branches:
  only:
    - main
    - /^v\d+\.\d+(\.\d+)?(-\S*)?$/
addons:
  sonarcloud:
    organization: molgenis
    token:
      secure: 
script:
  - mvn clean install -Pcoverage
deploy:
  provider: releases
  token:
    secure: 
  file: target/straglrTsv2Vcf.jar
  prerelease: true
  on:
    tags: true
  edge: true # opt in to dpl v2
